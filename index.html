<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Michael's Sorting Adventure</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Sorting Adventure"><meta name="theme-color" content="#eaf8ff"><meta name="mobile-web-app-capable" content="yes"><style>
:root{font-family:system-ui,'Segoe UI',sans-serif;color:#263350;background:#e9f7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 10%,#fff2a5 0,transparent 28%),radial-gradient(circle at 95% 65%,#e5d3ff 0,transparent 32%),#eaf8ff;padding:16px}main{max-width:920px;margin:0 auto}.panel{background:#fff;border:4px solid #fff;border-radius:30px;padding:24px;box-shadow:0 12px 35px #3061a026}h1{text-align:center;font-size:clamp(28px,5vw,42px);margin:6px 0;color:#3e49a8}h2{text-align:center;margin:12px 0}p{text-align:center;color:#53647a}button{cursor:pointer;font:inherit;font-weight:800;border:3px solid #d5dff4;border-radius:20px;background:white;color:#2a3954;padding:13px;transition:transform .15s,box-shadow .15s,border-color .15s;touch-action:manipulation}button:hover{transform:translateY(-3px);box-shadow:0 6px 0 #d3e4ff}button:active{transform:scale(.96)}button:focus-visible{outline:4px solid #f8ae25;outline-offset:2px}button.selected{border-color:#675ce9;background:#eeeaff;box-shadow:0 5px 0 #bcb3fa}.primary{background:#6358e9;color:#fff;border-color:#6358e9;box-shadow:0 5px 0 #4036a4}.primary:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}.options,.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:18px 0}.choice{min-height:125px;background:#f9fcff;font-size:17px}.emoji{font-size:47px;display:block;margin-bottom:7px;line-height:1.35}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}.pill{background:#f0f3ff;padding:8px 14px;border-radius:40px;font-weight:800}.progress{height:20px;background:#edf0fb;border-radius:40px;overflow:hidden;margin:12px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,#5cc9fc,#8970ee);border-radius:40px;transition:width .35s}.picture{position:relative;overflow:hidden;text-align:center;margin:15px auto;padding:15px 12px 20px;background:linear-gradient(150deg,#e4f8ff,#fff4d9);border:3px dashed #b7caff;border-radius:28px;max-width:580px;min-height:220px}.big{font-size:clamp(100px,19vw,155px);line-height:1.25;filter:drop-shadow(0 7px 3px #45566b22)}.pop{animation:pop .45s both}.word{font-size:clamp(23px,4vw,33px);font-weight:900}.feedback{min-height:38px;text-align:center;font-size:25px;font-weight:900}.good{color:#138747}.bad{color:#c46a1b}.hide{display:none!important}.spark{position:fixed;pointer-events:none;font-size:27px;z-index:5;animation:floatup .9s ease-out forwards}.shake{animation:shake .35s}.celebrate{animation:bounce .5s}.sound{font-size:14px;padding:9px 12px}.hint{font-size:15px;color:#5d6d85;text-align:center}#done{text-align:center}#done .big{font-size:95px}.ribbon{font-size:24px;text-align:center;min-height:34px;font-weight:900;color:#7549bd}@keyframes pop{from{transform:scale(.65) rotate(-8deg);opacity:.3}70%{transform:scale(1.13) rotate(3deg)}to{transform:scale(1);opacity:1}}@keyframes floatup{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-125px) rotate(25deg) scale(1.4);opacity:0}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}@keyframes bounce{50%{transform:scale(1.06)}}@media(max-width:640px){body{padding:8px}.panel{padding:14px}.options,.answers{grid-template-columns:repeat(2,1fr);gap:9px}.choice{min-height:106px;font-size:15px}.emoji{font-size:38px}.picture{min-height:190px}.big{font-size:95px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* Large category collection boards */
.answers{grid-template-columns:repeat(var(--category-count,2),minmax(0,1fr));align-items:stretch;gap:16px}
.answers .category-board{min-height:215px;padding:15px 10px;background:linear-gradient(180deg,#f8fbff,#eaf2ff);border:4px solid #bacdf5;border-radius:25px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px}
.answers .category-board .category-header{font-size:19px;font-weight:900;line-height:1.2}
.answers .category-board .category-symbol{font-size:53px;line-height:1.1}
.collection{display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;gap:7px;width:100%;min-height:72px;margin-top:5px;padding:10px 5px;border-radius:15px;background:#ffffffa8;border:2px dashed #c5d6f0}
.collection .collected{font-size:32px;line-height:1.25;background:#fff;border-radius:12px;min-width:45px;padding:5px;box-shadow:0 2px 5px #243b5c1b;animation:pop .35s both}
.collection .empty-note{font-size:13px;color:#64748b;font-weight:600;align-self:center}
.answers .category-board:disabled{opacity:1;cursor:default}
@media(max-width:640px){.answers{grid-template-columns:repeat(var(--category-count,2),minmax(0,1fr));gap:7px}.answers .category-board{min-height:180px;padding:9px 4px}.answers .category-board .category-header{font-size:14px}.answers .category-board .category-symbol{font-size:36px}.collection{gap:3px;padding:5px 2px}.collection .collected{font-size:23px;min-width:31px;padding:3px}}

/* iPad-friendly touch layout */
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}body{padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));-webkit-user-select:none;user-select:none}button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}main{max-width:1280px}.panel{padding:clamp(12px,2vw,26px)}.answers .category-board{min-height:250px;touch-action:manipulation}.collection{min-height:100px}.picture{min-height:170px;max-width:420px;margin:8px auto;padding:7px}.big{font-size:clamp(75px,11vw,115px)}.word{font-size:clamp(21px,3vw,30px)}.answers{margin:12px 0}.stats{margin:8px 0}.progress{margin:8px 0}.ribbon{min-height:22px}.hint{margin:5px}.category-board{min-width:0}
@media (min-width:700px) and (orientation:landscape){.panel{padding:14px 22px}.picture{min-height:130px}.big{font-size:80px}.answers .category-board{min-height:220px}.collection .collected{font-size:35px}.answers .category-board .category-symbol{font-size:44px}h2{margin:6px 0}.feedback{min-height:28px;font-size:20px}}
@media (max-width:699px){.answers .category-board{min-height:205px}.collection .collected{font-size:25px}.answers .category-board .category-symbol{font-size:38px}}
</style></head><body><main class="panel"><section id="setup"><h1>🌈 Super Sorting Adventure!</h1><p>Pick 2 or 3 groups. Let's play!</p><div id="options" class="options"></div><div class="toolbar"><strong id="selection">Choose 2 or 3</strong><button id="start" class="primary" disabled>🚀 Let's Go!</button></div></section><section id="game" class="hide"><div class="toolbar"><strong id="counter">Picture 1 of 12</strong><div><button id="sound" class="sound" aria-pressed="false">🔇 Sound off</button> <button id="change" class="sound">⚙️ Groups</button></div></div><div class="progress" aria-label="Round progress"><div id="fill" class="fill"></div></div><div class="stats"><span class="pill" id="first">⭐ First try: 0</span><span class="pill" id="streak">🔥 Streak: 0</span><span class="pill" id="retry">🔄 Tries again: 0</span></div><div class="ribbon" id="ribbon"></div><div class="picture" id="picture"><div class="big" id="pic"></div><div class="word" id="word"></div></div><h2>Where does it go? 🤔</h2><p class="hint">Tap a category to add the picture to its collection!</p><div id="answers" class="answers"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><p class="hint">Say the picture's name, then choose a group!</p></section><section id="done" class="hide"><div class="big">🏆🎉</div><h1>You did it!</h1><p id="summary"></p><div class="toolbar" style="justify-content:center"><button id="again" class="primary">🔁 Play again</button><button id="newcats">🎨 New groups</button></div></section></main><script>
const categories={
farm:{name:'Farm Animals',icon:`<svg viewBox='0 0 100 85' width='70' height='60' aria-hidden='true'><path d='M8 35 L50 5 L92 35' fill='#b94737' stroke='#8e3026' stroke-width='5'/><rect x='15' y='34' width='70' height='48' rx='3' fill='#d95443'/><rect x='37' y='47' width='27' height='35' fill='#f7e5c5' stroke='#8e3026' stroke-width='3'/><path d='M37 47 L64 82 M64 47 L37 82' stroke='#8e3026' stroke-width='3'/><rect x='45' y='21' width='12' height='12' fill='#fff4c8'/></svg>`,items:[['🐄','Cow'],['🐖','Pig'],['🐎','Horse'],['🐑','Sheep'],['🐓','Chicken'],['🦆','Duck'],['🐐','Goat'],['🦃','Turkey'],['🐇','Rabbit'],['🐕','Dog'],['🐈','Cat'],['🐂','Ox']]},
body:{name:'Body Parts',icon:'🧍',items:[['👁️','Eye'],['👂','Ear'],['👃','Nose'],['👄','Mouth'],['✋','Hand'],['🦶','Foot'],['🦵','Leg'],['💪','Arm'],['🦷','Tooth'],['👅','Tongue'],['🧠','Brain'],['🫁','Lungs']]},
food:{name:'Food',icon:'🍽️',items:[['🍎','Apple'],['🍌','Banana'],['🥕','Carrot'],['🍕','Pizza'],['🍞','Bread'],['🍪','Cookie'],['🍇','Grapes'],['🍓','Strawberry'],['🧀','Cheese'],['🥚','Egg'],['🍉','Watermelon'],['🥦','Broccoli']]},
clothes:{name:'Clothing',icon:'🚪',items:[['👕','Shirt'],['👖','Pants'],['🧦','Socks'],['👟','Shoes'],['🧢','Hat'],['🧥','Coat'],['👗','Dress'],['🩳','Shorts'],['🧤','Gloves'],['🧣','Scarf'],['👢','Boots'],['👚','Blouse']]},
vehicles:{name:'Vehicles',icon:'🛣️',items:[['🚗','Car'],['🚌','Bus'],['🚚','Truck'],['🚂','Train'],['✈️','Airplane'],['⛵','Boat'],['🚲','Bicycle'],['🚁','Helicopter'],['🚜','Tractor'],['🚑','Ambulance'],['🚒','Fire Truck'],['🛵','Scooter']]},
wild:{name:'Wild Animals',icon:'🌴🌳',items:[['🦁','Lion'],['🐘','Elephant'],['🦓','Zebra'],['🦒','Giraffe'],['🐒','Monkey'],['🐅','Tiger'],['🐻','Bear'],['🦊','Fox'],['🐺','Wolf'],['🦏','Rhino'],['🦛','Hippo'],['🐊','Crocodile']]}};

const $=id=>document.getElementById(id);let selected=[],deck=[],roundIcons={},previousRound={},collected={},index=0,firstCorrect=0,wrong=0,missed=false,locked=false,streak=0,soundOn=false,audioCtx=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tone(freq=600,duration=.1,delay=0){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.type='sine';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.075,t);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration)}catch(e){}}
function sparkle(){let rect=$('picture').getBoundingClientRect();for(let i=0;i<9;i++){let el=document.createElement('span');el.className='spark';el.textContent=['⭐','✨','🌟','🎈'][i%4];el.style.left=(rect.left+rect.width*(.12+Math.random()*.76))+'px';el.style.top=(rect.top+rect.height*(.25+Math.random()*.5))+'px';document.body.append(el);setTimeout(()=>el.remove(),950)}}
function setup(){['setup','game','done'].forEach(id=>$(id).classList.toggle('hide',id!=='setup'));$('options').innerHTML='';Object.entries(categories).forEach(([id,c])=>{let b=document.createElement('button');b.className='choice'+(selected.includes(id)?' selected':'');b.innerHTML=`<span class="emoji">${c.items[0][0]}</span>${c.name}`;b.setAttribute('aria-pressed',selected.includes(id));b.onclick=()=>{if(selected.includes(id))selected=selected.filter(x=>x!==id);else if(selected.length<3)selected.push(id);setup()};$('options').append(b)});$('selection').textContent=`${selected.length} selected · choose 2 or 3`;$('start').disabled=selected.length<2}
function start(){deck=shuffle(selected.flatMap(id=>{const pool=categories[id].items.map(([emoji,word])=>({emoji,word,id}));const fresh=shuffle(pool.filter(item=>!(previousRound[id]||[]).includes(item.word)));const old=shuffle(pool.filter(item=>(previousRound[id]||[]).includes(item.word)));return [...fresh,...old].slice(0,6)}));selected.forEach(id=>previousRound[id]=deck.filter(item=>item.id===id).map(item=>item.word));roundIcons={};collected={};selected.forEach(id=>{collected[id]=[];const used=new Set(deck.filter(item=>item.id===id).map(item=>item.word));roundIcons[id]=shuffle(categories[id].items.filter(([emoji,word])=>!used.has(word)))[0][0]});index=0;firstCorrect=0;wrong=0;streak=0;['setup','done'].forEach(id=>$(id).classList.add('hide'));$('game').classList.remove('hide');show()}
function show(){if(index>=deck.length){$('game').classList.add('hide');$('done').classList.remove('hide');$('summary').textContent=`⭐ ${firstCorrect} out of ${deck.length} correct on the first try (${Math.round(firstCorrect/deck.length*100)}%). ${wrong} extra tries. Great work!`;tone(520,.16);tone(660,.16,.18);tone(820,.25,.36);sparkle();return}missed=false;locked=false;const item=deck[index];$('counter').textContent=`Picture ${index+1} of ${deck.length}`;$('fill').style.width=(100*index/deck.length)+'%';$('first').textContent=`⭐ First try: ${firstCorrect}`;$('streak').textContent=`🔥 Streak: ${streak}`;$('retry').textContent=`🔄 Tries again: ${wrong}`;$('pic').textContent=item.emoji;$('pic').className='big pop';$('word').textContent=item.word;$('feedback').textContent='';$('feedback').className='feedback';$('ribbon').textContent=streak>=3?'🌟 Super streak! 🌟':'';renderBoards()}
function renderBoards(){
  const area=$('answers');area.style.setProperty('--category-count',selected.length);area.innerHTML='';
  selected.forEach(id=>{
    const b=document.createElement('button');b.className='category-board';
    b.setAttribute('aria-label',categories[id].name+', '+collected[id].length+' sorted');
    b.innerHTML=`<span class="category-symbol">${roundIcons[id]}</span><span class="category-header">${categories[id].name}</span><span class="collection">${collected[id].length?collected[id].map(x=>`<span class="collected" title="${x.word}" aria-label="${x.word}">${x.emoji}</span>`).join(''):'<span class="empty-note">Your pictures go here!</span>'}</span>`;
    b.onclick=()=>answer(id);area.append(b);
  });
}
function answer(id){if(locked)return;if(id===deck[index].id){locked=true;collected[id].push(deck[index]);renderBoards();if(!missed){firstCorrect++;streak++}else streak=0;$('feedback').textContent=['🎉 Great job!','🌟 You got it!','👏 Awesome!','✨ Nice sorting!'][Math.floor(Math.random()*4)];$('feedback').className='feedback good';$('first').textContent=`⭐ First try: ${firstCorrect}`;$('streak').textContent=`🔥 Streak: ${streak}`;$('picture').classList.add('celebrate');sparkle();tone(550,.12);tone(750,.17,.13);if((index+1)%6===0)$('ribbon').textContent='🎁 Level complete!';setTimeout(()=>{$('picture').classList.remove('celebrate');index++;show()},1050)}else{wrong++;streak=0;missed=true;$('retry').textContent=`🔄 Tries again: ${wrong}`;$('streak').textContent='🔥 Streak: 0';$('feedback').textContent='💛 Good try! Pick another!';$('feedback').className='feedback bad';$('picture').classList.remove('shake');void $('picture').offsetWidth;$('picture').classList.add('shake');tone(290,.14)}}
$('start').onclick=start;$('change').onclick=setup;$('again').onclick=start;$('newcats').onclick=setup;$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Sound on':'🔇 Sound off';$('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn)tone(650,.12)};setup();
</script></body></html>
